<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFLAKY — File Type Detection</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" class="site-title">
                <img src="img/myLogoCropped.png" alt="SOFLAKY">
            </a>
        </div>
        <nav>
            <div class="menu-btn" id="menu-btn">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="writeups.html">Writeups</a></li>
            </ul>
        </nav>
    </header>

    <main class="tool-page">
        <div class="tool-container">

            <div class="tool-header">
                <span class="section-label" style="justify-content:center;">Tool</span>
                <h1>File Type <span>Detection</span></h1>
                <p>Upload a file to identify its type and size using magic bytes &amp; MIME detection.</p>
            </div>

            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" aria-label="Choose a file">
                <span class="upload-icon">📂</span>
                <h3>Drop a file here</h3>
                <p>or <span class="browse">browse</span> to choose one</p>
            </div>

            <div id="resultCard" class="result-card" style="display:none;">
                <div class="result-row">
                    <span class="result-label">File Name</span>
                    <span class="result-value" id="res-name">—</span>
                </div>
                <div class="result-row">
                    <span class="result-label">File Size</span>
                    <span class="result-value" id="res-size">—</span>
                </div>
                <div class="result-row">
                    <span class="result-label">MIME Type</span>
                    <span class="result-value" id="res-mime">—</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Identified Type</span>
                    <span class="result-value" id="res-type">—</span>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2025 Mahmoud — SOFLAKY</p>
        <div class="footer-links">
            <a href="projects.html">← Back to Projects</a>
        </div>
    </footer>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('res-name').textContent = file.name;
            document.getElementById('res-size').textContent = formatSize(file.size);
            document.getElementById('res-mime').textContent = file.type || 'Unknown';

            const reader = new FileReader();
            reader.onload = function(e) {
                const uint8 = new Uint8Array(e.target.result);
                document.getElementById('res-type').textContent = identifyFileType(uint8);
                document.getElementById('resultCard').style.display = 'block';
            };
            reader.readAsArrayBuffer(file.slice(0, 16));
        });

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / 1048576).toFixed(2) + ' MB';
        }

        function identifyFileType(bytes) {
            const signatures = {
                'FFD8FF':       'JPEG Image',
                '89504E47':     'PNG Image',
                '25504446':     'PDF Document',
                '424D':         'BMP Image',
                '47494638':     'GIF Image',
                '49492A00':     'TIFF Image',
                '4D4D002A':     'TIFF Image',
                '504B0304':     'ZIP Archive',
                '526172211A07': 'RAR Archive',
                '7F454C46':     'ELF Executable',
                'D0CF11E0':     'DOC / Office 97-2003',
                'CFAD12F0':     'PPT (PowerPoint 97-2003)',
                '5A4D':         'EXE (Windows Executable)',
                '00000014':     'MP4 Video',
                '000001BA':     'MPG Video',
                '00000018':     'MOV Video',
                '1F8B':         'GZIP Archive',
                '425A68':       'BZIP2 Archive',
            };

            let hex = '';
            for (let i = 0; i < bytes.length; i++) {
                hex += bytes[i].toString(16).padStart(2,'0').toUpperCase();
            }

            for (const [sig, type] of Object.entries(signatures)) {
                if (hex.startsWith(sig)) return type;
            }
            return 'Unknown File Type';
        }

        const zone = document.getElementById('uploadZone');
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); });

        const menuBtn = document.getElementById('menu-btn');
        const navLinks = document.getElementById('nav-links');
        menuBtn.addEventListener('click', () => navLinks.classList.toggle('active'));
    </script>

</body>
</html>
