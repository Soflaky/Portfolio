<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFLAKY — Steganography Tool</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" class="site-title">
                <img src="img/myLogoCropped.png" alt="SOFLAKY">
            </a>
        </div>
        <nav>
            <div class="menu-btn" id="menu-btn">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="writeups.html">Writeups</a></li>
                <li><a href="index.html#contact" class="contact-btn">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="tool-page">
        <div class="tool-container">
            <div class="tool-header">
                <span class="section-label" style="justify-content:center;">Tool</span>
                <h1>Steganography <span>Tool</span></h1>
                <p>Hide or extract secret text inside PNG/JPEG images using LSB steganography with XOR encryption.</p>
            </div>

            <div class="stego-card">
                <label for="imageInput">Image File</label>
                <input type="file" id="imageInput" accept="image/png, image/jpeg">

                <label for="operation">Operation</label>
                <select id="operation" onchange="toggleInputs()">
                    <option value="hide">Hide Text</option>
                    <option value="extract">Extract Text</option>
                </select>

                <label for="textInput" id="textLabel">Text to Hide</label>
                <input type="text" id="textInput" placeholder="Enter text to hide…">

                <label for="keyInput" id="keyLabel" style="display:none;">Extraction Key</label>
                <input type="password" id="keyInput" placeholder="Enter key to extract…" style="display:none;">

                <button onclick="processImage()">Process Image</button>
                <div class="loader" id="loader"></div>
                <a id="downloadBtn" download="stego_image.png" style="display:none;">↓ Download Stego Image</a>
                <div id="output" style="display:none;"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Mahmoud — SOFLAKY</p>
        <div class="footer-links">
            <a href="projects.html">← Back to Projects</a>
        </div>
    </footer>

    <script>
        function toggleInputs() {
            const operation = document.getElementById('operation').value;
            const textInput = document.getElementById('textInput');
            const textLabel = document.getElementById('textLabel');
            const keyInput  = document.getElementById('keyInput');
            const keyLabel  = document.getElementById('keyLabel');
            if (operation === 'hide') {
                textInput.style.display = 'block';
                textLabel.style.display = 'block';
                keyInput.style.display  = 'none';
                keyLabel.style.display  = 'none';
            } else {
                textInput.style.display = 'none';
                textLabel.style.display = 'none';
                keyInput.style.display  = 'block';
                keyLabel.style.display  = 'block';
            }
        }

        function generateKey() {
            return Math.random().toString(36).substring(2, 10);
        }

        function processImage() {
            const imageInput  = document.getElementById('imageInput');
            const textInput   = document.getElementById('textInput');
            const keyInput    = document.getElementById('keyInput');
            const operation   = document.getElementById('operation').value;
            const output      = document.getElementById('output');
            const loader      = document.getElementById('loader');
            const downloadBtn = document.getElementById('downloadBtn');

            output.textContent = '';
            output.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'block';

            const file = imageInput.files[0];
            if (!file) { showError("Please upload an image."); return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx    = canvas.getContext('2d');
                    canvas.width  = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    if (operation === 'hide') {
                        const text = textInput.value;
                        if (!text) { showError("Please enter text to hide."); return; }
                        const key = generateKey();
                        const encryptedText = encryptText(text, key);
                        if (!canTextFitInImage(encryptedText, img.width, img.height)) {
                            showError("Text is too long for this image."); return;
                        }
                        hideText(ctx, encryptedText, img.width, img.height);
                        downloadBtn.href = canvas.toDataURL('image/png');
                        downloadBtn.style.display = 'block';
                        output.innerHTML = `Text hidden successfully.<br>Your key: <strong>${key}</strong><br>Save this key to extract the hidden text.`;
                        output.style.display = 'block';
                    } else {
                        const key = keyInput.value;
                        if (!key) { showError("Please enter the key."); return; }
                        const extractedText  = extractText(ctx, img.width, img.height);
                        const decryptedText  = decryptText(extractedText, key);
                        output.textContent   = decryptedText
                            ? `Extracted Text: ${decryptedText}`
                            : "Incorrect key or no hidden text found.";
                        output.style.display = 'block';
                    }
                    loader.style.display = 'none';
                };
            };
            reader.readAsDataURL(file);
        }

        function canTextFitInImage(text, width, height) {
            return textToBinary(text + '\0').length <= width * height * 3;
        }

        function hideText(ctx, text, width, height) {
            const binaryText = textToBinary(text + '\0');
            let idx = 0;
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                if (idx >= binaryText.length) break;
                data[i]     = (data[i]     & 0xFE) | parseInt(binaryText[idx++]);
                if (idx < binaryText.length) data[i+1] = (data[i+1] & 0xFE) | parseInt(binaryText[idx++]);
                if (idx < binaryText.length) data[i+2] = (data[i+2] & 0xFE) | parseInt(binaryText[idx++]);
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function extractText(ctx, width, height) {
            let binary = '';
            const data = ctx.getImageData(0, 0, width, height).data;
            for (let i = 0; i < data.length; i += 4) {
                binary += (data[i] & 1).toString();
                binary += (data[i+1] & 1).toString();
                binary += (data[i+2] & 1).toString();
            }
            return binaryToText(binary);
        }

        function encryptText(text, key) {
            return text.split('').map((c, i) =>
                String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))
            ).join('');
        }
        function decryptText(text, key) { return encryptText(text, key); }

        function textToBinary(text) {
            return text.split('').map(c => c.charCodeAt(0).toString(2).padStart(8,'0')).join('');
        }
        function binaryToText(binary) {
            return binary.match(/.{1,8}/g).map(b => String.fromCharCode(parseInt(b,2))).join('').split('\0')[0];
        }

        function showError(message) {
            document.getElementById('loader').style.display = 'none';
            const output = document.getElementById('output');
            output.textContent = message;
            output.style.display = 'block';
        }

        const menuBtn  = document.getElementById('menu-btn');
        const navLinks = document.getElementById('nav-links');
        menuBtn.addEventListener('click', () => navLinks.classList.toggle('active'));
    </script>
</body>
</html>
